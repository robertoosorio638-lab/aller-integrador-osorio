<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Promedio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="contenedor-principal">
    <h1>Calculadora de Promedio</h1>
    <p>Ingrese las tres notas del corte para calcular el promedio.</p>

    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" step="0.1">

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" step="0.1">

    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" step="0.1">

    <button id="btn-calcular" onclick="calcularPromedio()">Calcular</button>

    <p id="resultado-promedio"></p>
    <p id="resultado-estado"></p>
  </div>

  <script>
    function calcularPromedio() {
      const nota1 = parseFloat(document.getElementById("nota1").value);
      const nota2 = parseFloat(document.getElementById("nota2").value);
      const nota3 = parseFloat(document.getElementById("nota3").value);

      if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("resultado-promedio").innerHTML = "Debe ingresar las tres notas.";
        document.getElementById("resultado-estado").innerHTML = "";
        return;
      }

      const totalNotas = 3;
      const promedio = (nota1 + nota2 + nota3) / totalNotas;

      document.getElementById("resultado-promedio").innerHTML = "Promedio: " + promedio.toFixed(2);

      if (promedio >= 3.0) {
        document.getElementById("resultado-estado").innerHTML = "Resultado: aprobado";
      } else {
        document.getElementById("resultado-estado").innerHTML = "Resultado: reprobado";
      }
    }
  </script>
</body>
</html>
